name: CI/CD Pipeline

on:
  push:
    branches: [ Tactician2311, main ]
  pull_request:
    branches: [ Tactician2311, main ]

jobs:
  # ── Job 1: Test ────────────────────────────────
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check syntax
        run: python -m py_compile API.py && echo "✅ API.py syntax OK"

      - name: Check imports
        run: |
          python -c "
          import ast, sys
          with open('API.py') as f:
              source = f.read()
          try:
              ast.parse(source)
              print('✅ API.py parsed successfully')
          except SyntaxError as e:
              print(f'❌ Syntax error: {e}')
              sys.exit(1)
          "

  # ── Job 2: Deploy to Railway ───────────────────
  deploy:
    name: Deploy to Railway
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/Tactician2311' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway up --service Database-Project --detach

  # ── Job 3: Notify ──────────────────────────────
  notify:
    name: Deployment Summary
    runs-on: ubuntu-latest
    needs: [test, deploy]
    if: always()

    steps:
      - name: Print summary
        run: |
          echo "================================================"
          echo "  CI/CD Pipeline Complete"
          echo "  Test job:   ${{ needs.test.result }}"
          echo "  Deploy job: ${{ needs.deploy.result }}"
          echo "  Branch:     ${{ github.ref_name }}"
          echo "  Commit:     ${{ github.sha }}"
          echo "================================================"
