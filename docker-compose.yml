version: '3.8'

services:

  # ── MySQL Database ────────────────────────────
  db:
    image: mysql:8.0
    container_name: school_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: admin
      MYSQL_DATABASE: school_db
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./courseDB.sql:/docker-entrypoint-initdb.d/01_schema.sql
      # Uncomment the line below to also load seed data on first run
      # (slow on first start — comment out after initial setup)
      # - ./inserts.sql:/docker-entrypoint-initdb.d/02_inserts.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-padmin"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ── Flask API ─────────────────────────────────
  api:
    build: .
    container_name: school_api
    restart: always
    ports:
      - "5000:5000"
    environment:
      DB_HOST: db
      DB_USER: root
      DB_PASSWORD: admin
      DB_NAME: school_db
      JWT_SECRET: change_this_in_production
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
